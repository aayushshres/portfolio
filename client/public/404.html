<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      GitHub Pages serves this file for any unknown path. Since the app uses
      client-side routing (BrowserRouter), we stash the requested URL and bounce
      to index.html, which restores it. Lets deep links like /admin work on refresh.
    -->
    <script>
      sessionStorage.redirect = location.href;
      location.replace(location.origin + "/");
    </script>
  </head>
  <body></body>
</html>
