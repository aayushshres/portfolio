name = "portfolio-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespaces
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "rate-limiter"
preview_id = "rate-limiter-preview"

# R2 Buckets — adjust bucket_name values if your existing buckets differ.
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "portfolio-data"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "portfolio-assets"

[vars]
NODE_ENV = "production"

# Secrets (set via `wrangler secret put`):
# ADMIN_PASSWORD_HASH  — bcrypt hash of your admin password
# JWT_SECRET           — random 64-char string
# RESEND_API_KEY       — from resend.com
# CONTACT_EMAIL        — the email address to send contact messages to
