name = "portfolio-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespaces

[[kv_namespaces]]
binding = "AUTH_STORE"
id = "9e6aec04c6f94ed2a645f76137c27dc3"
preview_id = "5b7c2130cb374a59a0edea29dc6d6e08"

# R2 Buckets — adjust bucket_name values if your existing buckets differ.
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "portfolio-data"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "portfolio-assets"

[vars]
NODE_ENV = "production"

# Secrets (set via `wrangler secret put`):
# ADMIN_PASSWORD_HASH  — bcrypt hash of your admin password
# JWT_SECRET           — random 64-char string
# RESEND_API_KEY       — from resend.com
# CONTACT_EMAIL        — the email address to send contact messages to

[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]
